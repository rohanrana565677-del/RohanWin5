<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RohanWin - 10s Timer & High Multiplier Aviator</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }
    body {
      background-color: #0b0e14;
      color: #ffffff;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 15px;
    }
    .game-card {
      background: #151c28;
      border: 1px solid #2a364f;
      border-radius: 16px;
      padding: 20px;
      width: 100%;
      max-width: 400px;
      box-shadow: 0 12px 30px rgba(0,0,0,0.6);
      text-align: center;
    }
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 15px;
      padding-bottom: 10px;
      border-bottom: 1px solid #2a364f;
    }
    .header h2 {
      font-size: 18px;
      color: #38bdf8;
    }
    .round-info {
      font-size: 12px;
      color: #94a3b8;
      background: #0f172a;
      padding: 4px 8px;
      border-radius: 6px;
    }
    .timer-banner {
      background: rgba(56, 189, 248, 0.1);
      border: 1px solid #38bdf8;
      color: #38bdf8;
      padding: 8px;
      border-radius: 8px;
      font-weight: bold;
      font-size: 14px;
      margin-bottom: 15px;
    }
    .canvas-container {
      position: relative;
      width: 100%;
      height: 220px;
      background: #090d16;
      border-radius: 12px;
      overflow: hidden;
      border: 1px solid #2a364f;
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }
    .multiplier-overlay {
      position: absolute;
      top: 45%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-size: 42px;
      font-weight: 800;
      color: #38bdf8;
      text-shadow: 0 0 15px rgba(56, 189, 248, 0.6);
    }
    .multiplier-overlay.crashed {
      color: #ef4444;
      text-shadow: 0 0 15px rgba(239, 68, 68, 0.6);
    }
    .status-text {
      position: absolute;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 13px;
      color: #94a3b8;
      letter-spacing: 0.5px;
    }
    .history-bar {
      display: flex;
      gap: 6px;
      overflow-x: auto;
      margin-top: 15px;
      padding-bottom: 5px;
    }
    .history-badge {
      background: #1e293b;
      color: #38bdf8;
      font-size: 11px;
      font-weight: bold;
      padding: 4px 8px;
      border-radius: 6px;
      white-space: nowrap;
    }
    .history-badge.high {
      color: #a855f7;
      border: 1px solid #a855f7;
    }
  </style>
</head>
<body>

  <div class="game-card">
    <div class="header">
      <h2>🚀 Aviator 20x</h2>
      <div class="round-info" id="roundId">राउंड #1001</div>
    </div>

    <div class="timer-banner" id="timerBanner">अगला राउंड: 10s</div>

    <div class="canvas-container">
      <canvas id="aviatorCanvas" width="360" height="220"></canvas>
      <div class="multiplier-overlay" id="multiplierText">1.00x</div>
      <div class="status-text" id="statusText">वेटिंग टाइमर चल रहा है...</div>
    </div>

    <div class="history-bar" id="historyBar">
      <span class="history-badge">1.45x</span>
      <span class="history-badge high">8.20x</span>
      <span class="history-badge high">18.50x</span>
      <span class="history-badge">2.10x</span>
    </div>
  </div>

  <script>
    const canvas = document.getElementById('aviatorCanvas');
    const ctx = canvas.getContext('2d');
    const multiplierText = document.getElementById('multiplierText');
    const timerBanner = document.getElementById('timerBanner');
    const statusText = document.getElementById('statusText');
    const roundIdElem = document.getElementById('roundId');
    const historyBar = document.getElementById('historyBar');

    let roundNumber = 1001;
    let waitTime = 10;
    let isFlying = false;
    let animationId;
    let targetMultiplier = 1.00;
    let currentMultiplier = 1.00;
    let flightProgress = 0;

    // 20x तक रैंडम टारगेट जनरेट करना
    function generateTargetMultiplier() {
      const rand = Math.random();
      if (rand < 0.4) {
        return (1.1 + Math.random() * 1.9).toFixed(2); // 1.1x - 3.0x
      } else if (rand < 0.75) {
        return (3.0 + Math.random() * 5.0).toFixed(2); // 3.0x - 8.0x
      } else if (rand < 0.92) {
        return (8.0 + Math.random() * 7.0).toFixed(2); // 8.0x - 15.0x
      } else {
        return (15.0 + Math.random() * 10.0).toFixed(2); // 15.0x - 25.0x
      }
    }

    function drawScene(progress, crashed = false) {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      // 1. बैकग्राउंड ग्रिड
      ctx.strokeStyle = '#1e293b';
      ctx.lineWidth = 1;
      for (let i = 0; i < canvas.width; i += 40) {
        ctx.beginPath();
        ctx.moveTo(i, 0);
        ctx.lineTo(i, canvas.height);
        ctx.stroke();
      }

      if (progress <= 0) return;

      // 2. कर्व लाइन (Trail)
      const startX = 20;
      const startY = canvas.height - 20;
      const endX = 20 + (canvas.width - 50) * Math.min(progress, 1);
      const endY = (canvas.height - 20) - (canvas.height - 50) * Math.pow(Math.min(progress, 1), 0.75);

      ctx.beginPath();
      ctx.moveTo(startX, startY);
      ctx.quadraticCurveTo(startX + (endX - startX) / 2, startY, endX, endY);
      ctx.strokeStyle = crashed ? '#ef4444' : '#ef4444';
      ctx.lineWidth = 4;
      ctx.stroke();

      // 3. प्लेन डॉट / ऑब्जेक्ट
      if (!crashed) {
        ctx.beginPath();
        ctx.arc(endX, endY, 7, 0, Math.PI * 2);
        ctx.fillStyle = '#f87171';
        ctx.shadowColor = '#ef4444';
        ctx.shadowBlur = 12;
        ctx.fill();
        ctx.shadowBlur = 0;
      }
    }

    function startFlight() {
      isFlying = true;
      targetMultiplier = parseFloat(generateTargetMultiplier());
      currentMultiplier = 1.00;
      flightProgress = 0;

      multiplierText.classList.remove('crashed');
      timerBanner.innerText = "🚀 फ्लाइट चालू है...";
      statusText.innerText = "टेक-ऑफ हो चुका है!";

      function animate() {
        if (currentMultiplier < targetMultiplier) {
          // मल्टीप्लायर की स्पीड बढ़ाना
          let speed = 0.01 + (currentMultiplier * 0.005);
          currentMultiplier += speed;
          flightProgress += 0.004;

          multiplierText.innerText = currentMultiplier.toFixed(2) + 'x';
          drawScene(flightProgress);

          animationId = requestAnimationFrame(animate);
        } else {
          // क्रैश होना
          multiplierText.innerText = targetMultiplier.toFixed(2) + 'x CRASH!';
          multiplierText.classList.add('crashed');
          statusText.innerText = "फ्लाइट क्रैश हो गई!";
          drawScene(flightProgress, true);
          
          addHistoryBadge(targetMultiplier.toFixed(2) + 'x');
          
          // क्रैश होने के बाद 10s वेटिंग टाइमर दोबारा शुरू करना
          setTimeout(() => {
            startWaitingTimer();
          }, 1500);
        }
      }

      animate();
    }

    function startWaitingTimer() {
      isFlying = false;
      waitTime = 10;
      roundNumber++;
      roundIdElem.innerText = `राउंड #${roundNumber}`;
      multiplierText.innerText = "1.00x";
      multiplierText.classList.remove('crashed');
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      const interval = setInterval(() => {
        timerBanner.innerText = `अगला राउंड: ${waitTime}s`;
        statusText.innerText = "वेटिंग टाइमर चल रहा है...";
        
        if (waitTime <= 0) {
          clearInterval(interval);
          startFlight();
        }
        waitTime--;
      }, 1000);
    }

    function addHistoryBadge(val) {
      const num = parseFloat(val);
      const badge = document.createElement('span');
      badge.className = `history-badge ${num >= 5 ? 'high' : ''}`;
      badge.innerText = val;
      historyBar.insertBefore(badge, historyBar.firstChild);
      
      if (historyBar.children.length > 6) {
        historyBar.removeChild(historyBar.lastChild);
      }
    }

    // पहला राउंड शुरू करें
    startWaitingTimer();
  </script>

</body>
          </html>
